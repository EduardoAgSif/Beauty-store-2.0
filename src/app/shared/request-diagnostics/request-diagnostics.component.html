<div class="diagnostics-backdrop" *ngIf="visible" (click)="close()">
  <section class="diagnostics-modal" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <header><h2>{{ title }}</h2><button type="button" aria-label="Close diagnostics" (click)="close()">×</button></header>
    <p class="privacy-note">Passwords, tokens, and authorization secrets are intentionally omitted from diagnostics.</p>
    <pre>{{ formattedDetails }}</pre>
    <button type="button" class="close-button" (click)="close()">Close</button>
  </section>
</div>
