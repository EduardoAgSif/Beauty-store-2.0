<!-- Desktop Header (Visible on PC / wide screens >= 768px) -->
<header class="desktop-navbar">
  <div class="ecom-container desktop-nav-container">
    <div class="brand-logo" (click)="navigateTo('/tabs/tab1')">
      <div class="elvi-emblem">
        <svg viewBox="0 0 40 40" class="emblem-svg">
          <defs>
            <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1B4332"/>
              <stop offset="60%" stop-color="#2D6A4F"/>
              <stop offset="100%" stop-color="#40916C"/>
            </linearGradient>
            <linearGradient id="navLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2D6A4F"/>
              <stop offset="50%" stop-color="#52B788"/>
              <stop offset="100%" stop-color="#95D5B2"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="12" fill="url(#navBgGrad)"/>
          <rect x="1" y="1" width="38" height="38" rx="11" fill="none" stroke="#74C69D" stroke-width="0.8" stroke-opacity="0.35"/>
          <g transform="translate(8, 7)">
            <path d="M 4 23 C 2 13 12 5 22 3 C 20 15 11 24 4 23 Z" fill="url(#navLeafGrad)"/>
            <path d="M 5 22 Q 13 14 21 4" stroke="#D8F3DC" stroke-width="1.1" stroke-linecap="round" fill="none"/>
            <path d="M 10 17 Q 15 15 17 12" stroke="#D8F3DC" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.8"/>
            <circle cx="19" cy="6" r="1" fill="#FFFFFF" opacity="0.9"/>
          </g>
        </svg>
      </div>
      <div class="brand-text-group">
        <div class="logo-text-wrapper">
          <span class="elvi-e">
            E
            <svg class="e-leaf-accent" viewBox="0 0 16 14" fill="none">
              <path d="M 2 12 C 1 6 8 2 14 1 C 12 7 7 12.5 2 12 Z" fill="url(#navLeafGrad)"/>
              <path d="M 2.5 11.5 Q 7.5 7.5 13.5 2" stroke="#D8F3DC" stroke-width="0.8" stroke-linecap="round"/>
            </svg>
          </span><span class="elvi-rest">lvi</span>
        </div>
        <span class="brand-tagline">NATURAL BOTANICALS</span>
      </div>
    </div>

    <nav class="desktop-nav-links">
      <a
        routerLink="/tabs/tab1"
        routerLinkActive="active-link"
        (click)="navigateTo('/tabs/tab1')"
        title="Home"
        aria-label="Home"
        class="nav-icon-link"
        >
        <ion-icon name="home-outline"></ion-icon>
      </a>

      <a
        routerLink="/tabs/tab2"
        routerLinkActive="active-link"
        (click)="navigateTo('/tabs/tab2')"
        title="Shopping Bag"
        aria-label="Shopping Bag"
        class="nav-icon-link cart-link"
        >
        <ion-icon name="cart-outline"></ion-icon>
        @if ((cartCount$ | async); as count) {
          <span class="desktop-cart-badge">
            {{ count }}
          </span>
        }
      </a>

      <a
        routerLink="/tabs/tab3"
        routerLinkActive="active-link"
        (click)="navigateTo('/tabs/tab3')"
        title="Account"
        aria-label="Account"
        class="nav-icon-link"
        >
        <ion-icon name="person-outline"></ion-icon>
      </a>
    </nav>
  </div>
</header>

<!-- Main Tabs Structure -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="mobile-tab-bar">
    <ion-tab-button tab="tab1" aria-label="Home">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="tab2" aria-label="Shopping Bag">
      <div class="cart-icon-wrapper">
        <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
        @if ((cartCount$ | async); as count) {
          <ion-badge color="danger" class="tab-badge">
            {{ count }}
          </ion-badge>
        }
      </div>
    </ion-tab-button>

    <ion-tab-button tab="tab3" aria-label="Account">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
