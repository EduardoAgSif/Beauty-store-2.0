<!-- Desktop Header (Visible on PC / wide screens >= 768px) -->
<header class="desktop-navbar">
  <div class="ecom-container desktop-nav-container">
    <div class="brand-logo" (click)="navigateTo('/tabs/tab1')">
      <ion-icon name="sparkles" class="logo-icon"></ion-icon>
      <span class="logo-text">Glow<span>Beauty</span></span>
    </div>

    <nav class="desktop-nav-links">
      <a routerLink="/tabs/tab1" routerLinkActive="active-link">
        <ion-icon name="storefront-outline"></ion-icon>
        Catálogo
      </a>
      <a routerLink="/tabs/tab2" routerLinkActive="active-link" class="cart-link">
        <ion-icon name="cart-outline"></ion-icon>
        Carrito
        <span class="desktop-cart-badge" *ngIf="(cartCount$ | async) as count">
          {{ count }}
        </span>
      </a>
      <a routerLink="/tabs/tab3" routerLinkActive="active-link">
        <ion-icon name="person-outline"></ion-icon>
        Mi Cuenta
      </a>
    </nav>
  </div>
</header>

<!-- Main Tabs Structure -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="mobile-tab-bar">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="storefront-outline"></ion-icon>
      <ion-label>Catálogo</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <div class="cart-icon-wrapper">
        <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
        <ion-badge color="danger" class="tab-badge" *ngIf="(cartCount$ | async) as count">
          {{ count }}
        </ion-badge>
      </div>
      <ion-label>Carrito</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
