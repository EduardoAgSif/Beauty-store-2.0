<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient for Emblem -->
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="60%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>

    <!-- Leaf Accent Gradient -->
    <linearGradient id="logoLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#95D5B2"/>
    </linearGradient>

    <!-- Text Brand Gradient -->
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem (Botanical Nature Leaf Mark) -->
  <g transform="translate(6, 7)">
    <rect width="56" height="56" rx="16" fill="url(#logoEmblemGrad)"/>
    <rect x="2" y="2" width="52" height="52" rx="14" fill="none" stroke="#74C69D" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- Botanical Leaf Icon in emblem (No lonely E) -->
    <g transform="translate(10, 8)">
      <path d="M 6 34 C 4 19 18 8 32 6 C 29 22 17 35 6 34 Z" fill="url(#logoLeafGrad)"/>
      <path d="M 8 33 Q 19 23 30 8" stroke="#D8F3DC" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M 15 27 Q 21 24 26 20" stroke="#D8F3DC" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
      <circle cx="28" cy="11" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    </g>
  </g>

  <!-- Brand Typography: Élvi -->
  <g transform="translate(74, 45)">
    <!-- Base text Élvi with stylized modern typography -->
    <text font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="url(#logoTextGrad)">
      <tspan fill="#1B4332">E</tspan><tspan fill="#2D6A4F">lvi</tspan>
    </text>

    <!-- Custom Botanical Leaf Accent over the main text 'E' -->
    <g transform="translate(-1, -43)">
      <path d="M 8 13 C 6 6 15 2 22 2 C 20 8 14 14 8 13 Z" fill="url(#logoLeafGrad)"/>
      <path d="M 9 12 Q 14 8 21 3" stroke="#D8F3DC" stroke-width="0.75" stroke-linecap="round" fill="none"/>
      <circle cx="21" cy="4" r="0.8" fill="#52B788"/>
    </g>
  </g>

  <!-- Subtitle Tagline: BOTANICAL BEAUTY -->
  <text x="76" y="58" font-family="'Poppins', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="#52B788">
    BOTANICAL BEAUTY
  </text>
</svg>
