<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient: Deep Botanical Forest to Emerald -->
    <linearGradient id="elviBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="60%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>

    <!-- Leaf Gradient: Vibrant Natural Spring Green -->
    <linearGradient id="leafGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="45%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#95D5B2"/>
    </linearGradient>

    <!-- Leaf Soft Glow / Shadow -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#081c15" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Organic Squircle Container -->
  <rect x="8" y="8" width="104" height="104" rx="30" fill="url(#elviBgGrad)"/>

  <!-- Subtle Inner Ring for Luxury Feel -->
  <rect x="11" y="11" width="98" height="98" rx="27" fill="none" stroke="#74C69D" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Capital 'E' Base Geometry (Modern, Clean, Elegant) -->
  <g fill="#FFFFFF" filter="url(#leafShadow)">
    <!-- Vertical Spine -->
    <path d="M 40 38 L 52 38 L 52 82 L 40 82 Z"/>
    <!-- Top Arm -->
    <path d="M 40 38 L 76 38 C 77.1 38 78 38.9 78 40 L 78 47 C 78 48.1 77.1 49 76 49 L 50 49 L 50 38 Z"/>
    <!-- Middle Arm (slightly shorter for luxury typography) -->
    <path d="M 50 56 L 70 56 C 71.1 56 72 56.9 72 58 L 72 63 C 72 64.1 71.1 65 70 65 L 50 65 Z"/>
    <!-- Bottom Arm -->
    <path d="M 40 71 L 76 71 C 77.1 71 78 71.9 78 73 L 78 80 C 78 81.1 77.1 82 76 82 L 40 82 Z"/>
  </g>

  <!-- Accent Leaf on the 'E' (Angled at 40° as acute accent) -->
  <g transform="translate(6, -2)">
    <!-- Leaf Body with organic curves -->
    <path d="M 50 32 C 48 20 62 13 74 13 C 72 25 61 33 50 32 Z" 
          fill="url(#leafGrad)" />
    <!-- Leaf Central Spine / Vein -->
    <path d="M 51 31 Q 61 23 72 14" 
          stroke="#D8F3DC" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Leaf Subtle Secondary Vein -->
    <path d="M 58 24 Q 63 21 67 22" 
          stroke="#D8F3DC" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Dewdrop Accent in Leaf -->
  <circle cx="73" cy="18" r="1.5" fill="#FFFFFF" opacity="0.85"/>
</svg>

